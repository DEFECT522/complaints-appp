<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>صفحة الشكاوي</title>
</head>
<body>
  <h2>اكتب شكوتك</h2>
  <input type="email" id="email" placeholder="اكتب بريدك الإلكتروني"><br><br>
  <textarea id="complaint" placeholder="اكتب شكوتك" rows="5" cols="40"></textarea><br>
  <button onclick="sendComplaint()">إرسال</button>

  <script>
    function sendComplaint() {
      const message = document.getElementById("complaint").value;
      const email = document.getElementById("email").value;

      fetch("/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: message, email: email })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          alert("تم الإرسال بنجاح");
        } else {
          alert("فشل في الإرسال");
        }
      });
    }
  </script>
</body>
</html>
